name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the agent jar
        run: bazelisk build //agent:agent_deploy.jar

      - name: Collect
        run: cp bazel-bin/agent/agent_deploy.jar bazel-tui-agent.jar

      - uses: actions/upload-artifact@v4
        with:
          name: bazel-tui-agent.jar
          path: bazel-tui-agent.jar

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bazel-tui-agent.jar
          generate_release_notes: true
