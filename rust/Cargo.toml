[package]
name = "bazelhook_ui"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
jni = "0.21"
libc = "0.2"
ratatui = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[[bin]]
name = "bazelhook-replay"
path = "src/bin/replay.rs"

[profile.release]
opt-level = 2
debug = false
strip = true
